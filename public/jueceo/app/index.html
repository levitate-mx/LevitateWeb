<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/jueceo/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Jueceo Levitate">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f1eb" media="(prefers-color-scheme: light)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Levitate">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Levitate · Jueceo</title>
  <style>
    html,body{margin:0;background:#101013;color:#f7f3ef;color-scheme:dark}
    #loading{min-height:100svh;display:grid;place-content:center;justify-items:center;gap:28px}
    #loading img{width:180px;height:auto;filter:brightness(0) invert(0.96)}
    #loading progress{width:128px;height:3px;accent-color:#d94c8c;border-radius:999px}
    @media(prefers-color-scheme:light){html,body{background:#f4f1eb;color:#2a2928;color-scheme:light}#loading img{filter:brightness(0) invert(0.16)}}
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Cargando Levitate">
    <img src="assets/assets/images/levitate_logo.png" alt="Levitate">
    <progress></progress>
  </div>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
